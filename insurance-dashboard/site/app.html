<style>
/* Layout: research terminal. Sticky tab bar, one working view at a time (overview, ranking, company, funds, method). */
:root {
  --bg: #f3f5f8; --panel: #ffffff; --fg: #12171f; --muted: #5a6575; --line: #dde2ea; --soft: #eaeef4;

  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1218; --panel: #161b23; --fg: #e7ebf1; --muted: #98a3b3; --line: #2a313c; --soft: #1e2530;
    --accent: #5aa9f0; --up: #4cc58a; --down: #ef7b6e; --warn: #e0a232;
    --s1: #5aa9f0; --s2: #e0a232; --s3: #46c2ae; --s4: #e07cb0; --s5: #9b8cf0; --s6: #aabf5c; --s7: #d09068; --s8: #8d99ab; --s9: #ef7b6e; --s10: #5ccbe6; --s11: #c08ad8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1218; --panel: #161b23; --fg: #e7ebf1; --muted: #98a3b3; --line: #2a313c; --soft: #1e2530;
  --accent: #5aa9f0; --up: #4cc58a; --down: #ef7b6e; --warn: #e0a232;
  --s1: #5aa9f0; --s2: #e0a232; --s3: #46c2ae; --s4: #e07cb0; --s5: #9b8cf0; --s6: #aabf5c; --s7: #d09068; --s8: #8d99ab; --s9: #ef7b6e; --s10: #5ccbe6; --s11: #c08ad8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; padding-inline: 16px; padding-block: 0 40px; }
.wrap { max-width: 1180px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }
.pos { color: var(--up); } .neg { color: var(--down); } .muted { color: var(--muted); }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, th[data-k]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 8px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.brand { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; justify-content: space-between; }
.brand h1 { margin: 0; font-size: 18px; font-weight: 700; }
.brand .asof { font-size: 12px; color: var(--muted); }
.tabs { display: flex; gap: 4px; overflow-x: auto; }
.tabs a { padding: 6px 12px; border-radius: 8px; text-decoration: none; color: var(--muted); white-space: nowrap; font-weight: 500; border: 1px solid transparent; }
.tabs a[aria-current="page"] { background: var(--panel); color: var(--fg); border-color: var(--line); }
.tabs a:hover { color: var(--fg); }

.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field label { font-size: 11.5px; color: var(--muted); }
select, input[type="search"] { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 100%; min-width: 130px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { background: transparent; border: 0; padding: 6px 11px; cursor: pointer; color: var(--muted); font-size: 13px; }
.seg button + button { border-inline-start: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--soft); color: var(--fg); font-weight: 600; }
.btn { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: 13px; }
.btn:hover { background: var(--soft); }

.kpi .l { font-size: 12px; color: var(--muted); } .kpi .v { font-size: 22px; font-weight: 600; } .kpi .s { font-size: 12px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.grid21 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 900px) { .grid2, .grid21 { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.panel h2 { margin: 0; font-size: 14px; font-weight: 600; }
.panel .hd { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; justify-content: space-between; }
.chart { width: 100%; height: 320px; } .chart.tall { height: 520px; } .chart.short { height: 260px; }
.src { font-size: 11.5px; color: var(--muted); }

.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th, td { padding: 6px 7px; border-bottom: 1px solid var(--line); text-align: end; white-space: nowrap; }
th:first-child, td:first-child { text-align: start; white-space: normal; min-width: 120px; }
thead th { font-weight: 500; font-size: 11.5px; color: var(--muted); position: sticky; top: 0; background: var(--panel); }
th[data-k] { cursor: pointer; user-select: none; }
th[aria-sort] { color: var(--fg); }
tbody tr:hover { background: var(--soft); }
tr.tot td { font-weight: 600; }
tr.pickrow { cursor: pointer; }
tr.pickrow.on td { background: var(--soft); }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; border: 1px solid var(--line); }
.chip.pass { color: var(--up); border-color: var(--up); } .chip.review { color: var(--warn); border-color: var(--warn); } .chip.fail { color: var(--down); border-color: var(--down); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-inline-end: 6px; }
.prose { display: flex; flex-direction: column; gap: 8px; max-width: 80ch; }
.prose p, .prose ul { margin: 0; } .prose ul { padding-inline-start: 18px; display: flex; flex-direction: column; gap: 4px; }
.prose h3 { margin: 8px 0 0; font-size: 13.5px; }
</style>
