# fox autopilot: a manual dry run in CI. Probes data.gov.il (the permitted channel) and plans the run; it never calls MAYA (its robots.txt
# disallows /api/ without TASE's permission — see docs/TASE_REQUEST.md). The real schedule runs on the owner's Mac (ops/, launchd);
# this job only reports: no --apply, no secrets, no commit, no deploy.
name: fox-autopilot
on:
  workflow_dispatch:
    inputs:
      companies:
        description: 'comma-separated company ids (empty = all with a MAYA id)'
        required: false
        default: ''
defaults:
  run:
    working-directory: insurance-dashboard
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Autopilot tests (recorded responses, no network)
        run: python -m unittest discover -s pipeline/autopilot/tests -v
      - name: Probe data.gov.il and plan the run (dry run, standard library only)
        run: python pipeline/autopilot/run.py --companies "${{ github.event.inputs.companies }}" --status-out autopilot-status.json --json autopilot-run.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autopilot-status
          path: |
            insurance-dashboard/autopilot-status.json
            insurance-dashboard/autopilot-run.json
          if-no-files-found: ignore
